spring.application.name=scan2serve-backend

# ==========================
# DATABASE CONFIGURATION
# ==========================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP - keep the connection pool small for Render Free
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ==========================
# JPA / HIBERNATE
# ==========================

spring.jpa.hibernate.ddl-auto=update

# Disable SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Don't keep database sessions open unnecessarily
spring.jpa.open-in-view=false

# ==========================
# SERVER
# ==========================

server.port=${PORT:8080}

# Reduce unnecessary server overhead
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ==========================
# MENU IMAGE UPLOAD
# ==========================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==========================
# JWT CONFIGURATION
# ==========================

app.jwt.secret=${SCAN2SERVE_JWT_SECRET}
app.jwt.expiration=${SCAN2SERVE_JWT_EXPIRATION:86400000}

# ==========================
# INITIAL ADMIN
# ==========================

app.initial-admin.name=${INITIAL_ADMIN_NAME:System Administrator}
app.initial-admin.username=${INITIAL_ADMIN_USERNAME}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD}

# ==========================
# CLOUDINARY
# ==========================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}